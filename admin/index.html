<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Login | BRIANE</title>
    <link rel="icon" type="image/x-icon" href="../assets/favicon.ico">
    <link rel="stylesheet" href="../style.css">
    <link rel="stylesheet" href="../auth/auth.css">
    <link rel="stylesheet" href="admin.css">
    <link rel="stylesheet" href="../background/weather-backgrounds.css">
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-firestore-compat.js"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="../background/background-manager.js"></script>
</head>
<body class="auth-page">
    <!-- Splash Screen -->
    <div id="splash-screen" style="position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: #ffffff; z-index: 9999; display: flex; flex-direction: column; align-items: center; justify-content: center; transition: opacity 0.5s ease; pointer-events: none;">
        <div class="logo-box" style="width: 80px; height: 80px; margin-bottom: 20px; background: linear-gradient(135deg, #4f46e5 0%, #3730a3 100%); border-radius: 20px; display: flex; align-items: center; justify-content: center;">
            <img src="../assets/icon.png" alt="BRIANE Logo" style="width: 50px; height: 50px; object-fit: contain;">
        </div>
        <h2 style="font-family: 'Plus Jakarta Sans', sans-serif; font-weight: 800; color: #0f172a; margin: 0; text-align: center; padding: 0 20px;">BRIANE Admin</h2>
        <p style="font-family: 'Plus Jakarta Sans', sans-serif; color: #64748b; margin-top: 8px; text-align: center; padding: 0 20px;">Secure Access Console</p>
        <div class="loader-line" style="width: 150px; height: 4px; background: #f1f5f9; border-radius: 10px; margin-top: 24px; overflow: hidden; position: relative;">
            <div class="loader-inner" style="position: absolute; width: 40%; height: 100%; background: #6366f1; border-radius: 10px;"></div>
        </div>
    </div>

    <!-- Background Container -->
    <div class="weather-bg-container"></div>
    <div class="auth-wrapper">
        <div class="auth-card">
            <div class="auth-logo">
                <div class="brand-logo" style="background: linear-gradient(135deg, #4f46e5 0%, #3730a3 100%);">
                    <img src="../assets/icon.png" alt="Logo" style="width: 32px; height: 32px; object-fit: contain;">
                </div>
            </div>
            <h1>Admin Console</h1>
            <p>Authorized administrator access only.</p>

            <div id="error-msg" class="error-banner" style="display: none;"></div>

            <div class="input-group">
                <label for="admin-email">Admin Email</label>
                <input type="email" id="admin-email" class="input-control" placeholder="admin@briane.com">
            </div>

            <div class="input-group">
                <label for="admin-password">Password</label>
                <input type="password" id="admin-password" class="input-control" placeholder="••••••••">
            </div>

            <button id="admin-login-btn" class="btn-submit" style="background: linear-gradient(135deg, #4f46e5 0%, #3730a3 100%);">
                <span class="btn-text">Authorize Access</span>
                <div class="loader"></div>
            </button>

            <div class="auth-footer">
                <a href="../index.html">← Return to Public Portal</a>
            </div>
        </div>
    </div>

    <script src="admin-login.js"></script>
</body>
</html>
