<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Account | BRIANE</title>
    <link rel="icon" type="image/x-icon" href="../assets/favicon.ico">
    <link rel="stylesheet" href="../style.css">
    <link rel="stylesheet" href="auth.css">
    <link rel="stylesheet" href="../background/weather-backgrounds.css">
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-firestore-compat.js"></script>
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="../background/background-manager.js"></script>
</head>
<body class="auth-page">
    <!-- Splash Screen -->
    <div id="splash-screen" style="position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: #ffffff; z-index: 9999; display: flex; flex-direction: column; align-items: center; justify-content: center; transition: opacity 0.5s ease; pointer-events: none;">
        <div class="logo-box" style="width: 80px; height: 80px; margin-bottom: 20px; background: linear-gradient(135deg, #6366f1 0%, #4f46e5 100%); border-radius: 20px; display: flex; align-items: center; justify-content: center;">
            <img src="../assets/icon.png" alt="BRIANE Logo" style="width: 50px; height: 50px; object-fit: contain;">
        </div>
        <h2 style="font-family: 'Plus Jakarta Sans', sans-serif; font-weight: 800; color: #0f172a; margin: 0; text-align: center; padding: 0 20px;">BRIANE</h2>
        <p style="font-family: 'Plus Jakarta Sans', sans-serif; color: #64748b; margin-top: 8px; text-align: center; padding: 0 20px;">Join the Network</p>
        <div class="loader-line" style="width: 150px; height: 4px; background: #f1f5f9; border-radius: 10px; margin-top: 24px; overflow: hidden; position: relative;">
            <div class="loader-inner" style="position: absolute; width: 40%; height: 100%; background: #6366f1; border-radius: 10px;"></div>
        </div>
    </div>

    <!-- Background Container -->
    <div class="weather-bg-container"></div>
    <div class="auth-wrapper">
        <div class="auth-card">
            <div class="auth-logo">
                <div class="brand-logo">
                    <img src="../assets/icon.png" alt="Logo" style="width: 32px; height: 32px; object-fit: contain;">
                </div>
            </div>
            <h1 id="register-title">Create Account</h1>
            <p id="register-desc">Join BRIANE to protect your community.</p>

            <div id="error-msg" class="error-banner" style="display: none;"></div>

            <form id="register-form">
                <!-- Step 1: Account Info -->
                <div id="account-info-section">
                    <div class="input-group">
                        <label for="reg-email">Email Address</label>
                        <input type="email" id="reg-email" class="input-control" placeholder="name@example.com" required>
                    </div>

                    <div class="input-group">
                        <label for="reg-phone">Phone Number</label>
                        <input type="tel" id="reg-phone" class="input-control" placeholder="+639123456789" required>
                        <small style="color: #64748b; font-size: 0.75rem; margin-top: 5px; display: block;">Include country code (e.g., +63)</small>
                    </div>

                    <div class="input-group">
                        <label for="reg-password">Password</label>
                        <input type="password" id="reg-password" class="input-control" placeholder="Min. 6 characters" required>
                    </div>

                    <div class="input-group">
                        <label for="confirm-password">Confirm Password</label>
                        <input type="password" id="confirm-password" class="input-control" placeholder="Repeat password" required>
                    </div>
                </div>

                <!-- Step 2: OTP Verification (Hidden) -->
                <div id="otp-section" style="display: none; margin-bottom: 2rem;">
                    <div class="input-group">
                        <label for="verification-code">6-Digit Verification Code</label>
                        <input type="text" id="verification-code" class="input-control" placeholder="000000" maxlength="6" style="text-align: center; font-size: 1.5rem; letter-spacing: 0.5rem; font-weight: 800;">
                    </div>
                    <p style="font-size: 0.85rem; color: #64748b; text-align: center;">Please check your messages for the code.</p>
                </div>

                <div id="recaptcha-container"></div>

                <!-- Rapid-Click Protected Buttons -->
                <button type="button" id="send-code-btn" class="btn-submit">
                    <span class="btn-text">Send Verification Code</span>
                    <div class="loader"></div>
                </button>

                <button type="submit" id="register-btn" class="btn-submit" style="display: none;">
                    <span class="btn-text">Verify & Create Account</span>
                    <div class="loader"></div>
                </button>
            </form>

            <div class="auth-footer">
                Already have an account? <a href="../index.html">Login here</a>
            </div>
        </div>
    </div>
    <script src="register.js"></script>
</body>
</html>
